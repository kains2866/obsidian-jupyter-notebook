name: Build and attest release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build and update
        required: true
        default: '0.6.5'
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: plugin-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.version || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Verify release identity
        run: node -e "const m=require('./manifest.json');if(!/^\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG)||m.version!==process.env.RELEASE_TAG)throw Error('Release tag does not match manifest')"
      - name: Attest standard installation assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Publish standard installation assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --title "Jupyter Notebook $RELEASE_TAG" --notes "See CHANGELOG.md for changes."
          gh release upload "$RELEASE_TAG" dist/main.js dist/manifest.json dist/styles.css --clobber
