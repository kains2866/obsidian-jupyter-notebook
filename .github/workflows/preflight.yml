name: Release preflight
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cross-platform:
    name: Cross-platform bridge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install bridge dependencies
        run: python -m pip install jupyter_client ipykernel psutil
      - run: npm ci
      - name: Test platform-independent plugin logic
        run: npx vitest run tests/environment-config.test.ts tests/environment-diagnostics.test.ts tests/i18n.test.ts
      - name: Test Python bridge and import inspection
        run: python -m unittest discover -s tests -p 'test_*.py'
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install jupyter_client ipykernel
      - run: npm ci
      - run: npm run release:preflight
      - run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py'
